server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_luxury?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

application:
  cors:
    allowed-origins: ${APPLICATION_CORS_ALLOWED_ORIGINS:http://localhost:5174}
  commission:
    modules:
      booking:
        # Fallback when destination.type doesn't match any entry below.
        default-rate: 6
        # Case-insensitive match by Destination.type
        type-rates:
          "dài hạng": 8
          "ngắn hạng": 6
      service-request:
        default-rate: 8
        # Case-insensitive match by TravelService.type
        type-rates:
          "private car": 10
          "clean service": 6
      experience-request:
        default-rate: 7
        # Case-insensitive match by Experience.type
        type-rates:
          "private tour": 9
          "dining experience": 6
  security:
    jwt:
      secret-key: ${APPLICATION_SECURITY_JWT_SECRET_KEY:}
      expiration: ${APPLICATION_SECURITY_JWT_EXPIRATION:86400000}
    oauth2:
      frontend-redirect-base-url: ${APPLICATION_SECURITY_OAUTH2_FRONTEND_REDIRECT_BASE_URL:http://localhost:5174}
  whatsapp:
    cloud-api:
      token: ${WHATSAPP_CLOUD_API_TOKEN:}
      phone-number-id: ${WHATSAPP_CLOUD_API_PHONE_NUMBER_ID:}
      template-name: ${WHATSAPP_CLOUD_API_TEMPLATE_NAME:}
      template-language: ${WHATSAPP_CLOUD_API_TEMPLATE_LANGUAGE:en_US}
