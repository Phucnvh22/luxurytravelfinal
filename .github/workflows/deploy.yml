name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set GHCR owner lowercase
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/luxury-travel-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/luxury-travel-backend:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/luxury-travel-frontend:latest
            ghcr.io/${{ env.OWNER_LC }}/luxury-travel-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_push
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate VPS secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo 'Missing secret VPS_HOST'; exit 1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo 'Missing secret VPS_USER'; exit 1; fi
          if [ -z "${{ secrets.VPS_APP_DIR }}" ]; then echo 'Missing secret VPS_APP_DIR'; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo 'Missing secret VPS_SSH_KEY'; exit 1; fi
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then echo 'Missing secret GHCR_TOKEN (PAT with read:packages)'; exit 1; fi

      - name: Write SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Validate runtime env
        run: |
          PORT="${{ secrets.VPS_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi

          HAS_DB_SECRETS=1
          if [ -z "${{ secrets.MYSQL_PASSWORD }}" ]; then HAS_DB_SECRETS=0; fi
          if [ -z "${{ secrets.MYSQL_ROOT_PASSWORD }}" ]; then HAS_DB_SECRETS=0; fi

          if [ "$HAS_DB_SECRETS" = "1" ]; then
            exit 0
          fi

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "\
            set -e; \
            cd '${{ secrets.VPS_APP_DIR }}'; \
            if [ ! -f .env ]; then \
              echo 'Missing MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD secrets and no .env found on VPS.'; \
              echo 'Fix: create VPS_APP_DIR/.env with MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD, or add GitHub Secrets MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD.'; \
              exit 1; \
            fi \
          "

      - name: Upload docker-compose.yml
        run: |
          PORT="${{ secrets.VPS_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '${{ secrets.VPS_APP_DIR }}'"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$PORT" docker-compose.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_DIR }}/docker-compose.yml"

      - name: Deploy
        run: |
          PORT="${{ secrets.VPS_SSH_PORT }}"
          if [ -z "$PORT" ]; then PORT=22; fi
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$PORT" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "\
            set -e; \
            cd '${{ secrets.VPS_APP_DIR }}'; \
            if [ -n '${{ secrets.MYSQL_PASSWORD }}' ]; then export MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}'; fi; \
            if [ -n '${{ secrets.MYSQL_ROOT_PASSWORD }}' ]; then export MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}'; fi; \
            if [ -n '${{ secrets.APPLICATION_SECURITY_JWT_SECRET_KEY }}' ]; then export APPLICATION_SECURITY_JWT_SECRET_KEY='${{ secrets.APPLICATION_SECURITY_JWT_SECRET_KEY }}'; fi; \
            if [ -n '${{ secrets.APPLICATION_CORS_ALLOWED_ORIGINS }}' ]; then export APPLICATION_CORS_ALLOWED_ORIGINS='${{ secrets.APPLICATION_CORS_ALLOWED_ORIGINS }}'; fi; \
            if [ -n '${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}' ]; then export SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID='${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID }}'; fi; \
            if [ -n '${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}' ]; then export SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET='${{ secrets.SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET }}'; fi; \
            if [ -n '${{ secrets.APPLICATION_SECURITY_OAUTH2_FRONTEND_REDIRECT_BASE_URL }}' ]; then export APPLICATION_SECURITY_OAUTH2_FRONTEND_REDIRECT_BASE_URL='${{ secrets.APPLICATION_SECURITY_OAUTH2_FRONTEND_REDIRECT_BASE_URL }}'; fi; \
            if [ -n '${{ secrets.WHATSAPP_CLOUD_API_TOKEN }}' ]; then export WHATSAPP_CLOUD_API_TOKEN='${{ secrets.WHATSAPP_CLOUD_API_TOKEN }}'; fi; \
            if [ -n '${{ secrets.WHATSAPP_CLOUD_API_PHONE_NUMBER_ID }}' ]; then export WHATSAPP_CLOUD_API_PHONE_NUMBER_ID='${{ secrets.WHATSAPP_CLOUD_API_PHONE_NUMBER_ID }}'; fi; \
            if [ -n '${{ secrets.WHATSAPP_CLOUD_API_TEMPLATE_NAME }}' ]; then export WHATSAPP_CLOUD_API_TEMPLATE_NAME='${{ secrets.WHATSAPP_CLOUD_API_TEMPLATE_NAME }}'; fi; \
            if [ -n '${{ secrets.WHATSAPP_CLOUD_API_TEMPLATE_LANGUAGE }}' ]; then export WHATSAPP_CLOUD_API_TEMPLATE_LANGUAGE='${{ secrets.WHATSAPP_CLOUD_API_TEMPLATE_LANGUAGE }}'; fi; \
            export GHCR_OWNER='${{ secrets.GHCR_USERNAME }}'; \
            if [ -z \"\$GHCR_OWNER\" ]; then GHCR_OWNER='${{ github.repository_owner }}'; fi; \
            export GHCR_OWNER=\$(echo \"\$GHCR_OWNER\" | tr '[:upper:]' '[:lower:]'); \
            export IMAGE_TAG=latest; \
            docker login ghcr.io -u \"\$GHCR_OWNER\" -p '${{ secrets.GHCR_TOKEN }}'; \
            docker compose pull; \
            docker compose up -d; \
            docker image prune -f \
          "
